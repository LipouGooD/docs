name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ 3902dff5-3fc7-45ca-8d2d-d6f2d6c14546 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ f4283bdbff47f9a3514a4a0e73ec0892 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify D1 binding
        shell: bash
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::error::Replace the placeholder database_id in wrangler.toml before deploying."
            exit 1
          fi

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy
