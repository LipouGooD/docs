name = "personal-docs"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "personal-docs"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
